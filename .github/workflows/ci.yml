name: CI

on:
  push:
    # master included so the stable branch gets its own CI signal after a promotion
    # PR merges. It never publishes — see the docker job's `if:`, which is pinned to
    # dev + tags rather than to "any push".
    branches: [dev, master]
    tags: ["v*"]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

# PRs supersede their own older runs. Pushes deliberately DON'T share a group: they used
# to serialise on `ci-<ref>`, so merging several PRs in a row queued each full run (tests
# AND publish) behind the previous one — minutes of dead waiting for no safety benefit,
# since the test jobs are independent. Only the publish must not overlap, and that is
# enforced by a job-level concurrency group on `docker` instead.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      # Catches "added a dependency to pyproject.toml but forgot to regenerate the lock" — which
      # would otherwise only surface as an ImportError inside the built image. Deliberately checks
      # COVERAGE, not equality with a fresh resolution: re-resolving would report drift every time
      # any upstream package publishes, which would be noise rather than signal.
      - name: requirements.lock covers pyproject dependencies
        run: |
          python - <<'PY'
          import re, sys, tomllib

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          # The extras the Dockerfile bundles into the image; `dev` is intentionally not locked.
          shipped = ("anthropic", "openai", "google", "posters")
          declared = list(project["dependencies"])
          for extra in shipped:
              declared += project.get("optional-dependencies", {}).get(extra, [])

          def norm(name: str) -> str:
              return re.split(r"[<>=!~\[; ]", name, maxsplit=1)[0].strip().lower().replace("_", "-")

          want = {norm(d) for d in declared}
          have = {
              norm(line)
              for line in open("requirements.lock")
              if "==" in line and not line.lstrip().startswith("#")
          }

          missing = sorted(want - have)
          if missing:
              sys.exit(
                  "requirements.lock is stale — missing: "
                  + ", ".join(missing)
                  + "\nRegenerate it with the command in .claude/CLAUDE.md"
              )
          print(f"lock covers all {len(want)} declared runtime dependencies")
          PY

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 3.12 only, deliberately: the shipped artifact is a single Docker image built
      # FROM python:3.12-slim, so 3.12 is the only interpreter this runs on in
      # production. Bump this in the same change as the Dockerfile base image.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements.lock
      # Runtime deps from the lock FIRST, so tests run against the exact versions the image ships;
      # dev tooling goes on top. Installing straight from pyproject's floors would let CI pass on
      # different dependency versions than production actually runs.
      - run: uv pip install --system -r requirements.lock
      - run: uv pip install --system -e ".[dev]"
      # --cov-report=xml adds an XML report on top of the term-missing one in
      # pyproject addopts, so Codecov has a file to ingest (badge stays "unknown"
      # without it).
      #
      # NOT sharded across a matrix. It was, briefly: three duration-balanced shards took this job
      # from 2m52 to 1m31 — and the whole workflow from 4m17 to 4m03, because the critical path is
      # e2e + docker and this job is no longer on it. Fourteen seconds did not justify a split
      # dependency, a committed durations file, a coverage-combine job and artifact plumbing.
      - run: pytest --cov-report=xml
      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` — the action reads `packageManager` from web/package.json, the same field
      # corepack honours in the Dockerfile. Keeping one source of truth is deliberate: CI used to
      # pin pnpm 10 while the image build floated to latest, so pnpm 11's minimumReleaseAge default
      # (1440min, 0 before v11) rejected fresh transitive deps in the publish job that all four PR
      # checks had passed. Green CI must mean the image builds.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web lint
      - run: pnpm -C web test --run
      - run: pnpm -C web build

  # Deliberately NOT `needs: [test-web]`. It only ever needed that job's `web-dist` artifact, so the
  # dependency put a ~1m30 wait in front of the longest job on the board for a build that takes
  # seconds. Building the SPA here instead lets e2e start at t=0 and run alongside test-web, which
  # takes that wait off the critical path. The cost is one extra `vite build` (and its install) —
  # more CI minutes, less wall-clock, which is the trade asked for.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # Same pnpm setup as test-web — version comes from web/package.json's `packageManager`, so the
      # two jobs and the Dockerfile cannot drift apart.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      # Same ordering as test-python: pinned runtime deps first, dev tooling on top.
      - run: pip install -r requirements.lock
      - run: pip install -e ".[dev]"
      # Cache the downloaded browser. Keyed on the resolved playwright version rather than
      # on pyproject, because the pin is a floor (">=1.45") — keying on the manifest would
      # keep serving a stale browser after pip resolved a newer playwright.
      - id: pw
        run: |
          echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      # install-deps is the apt half and must run every time (system libs aren't cached);
      # the browser download itself is skipped when the cache above hits.
      - run: playwright install-deps chromium
      - run: playwright install chromium
      - run: pytest -m e2e --no-cov --reruns 2 --reruns-delay 5

  docker-smoke:
    # The ONLY thing that runs the actual image. Every other job tests the source: e2e boots
    # uvicorn in-process, so nothing else would notice the PUID/PGID drop failing, web/dist
    # landing somewhere the app doesn't look, or a missing runtime package — all of which are
    # invisible until a user pulls the tag. Single-arch and load-only on purpose: this exists to
    # boot the thing, not to publish it, and it primes the layer cache the publish job reuses.
    # Runs on PRs too, where the publish job deliberately never does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: shortlist:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image and wait for it to report healthy
        run: |
          set -euo pipefail
          # A named volume, not a bind mount: /config must be writable by the dropped-to UID, and
          # a bind mount would be root-owned and mask exactly the permission bug this job exists
          # to catch.
          docker run -d --name smoke -e PUID=1000 -e PGID=1000 -p 5959:5959 \
            -v shortlist-smoke:/config shortlist:smoke
          for _ in $(seq 1 60); do
            state=$(docker inspect smoke --format '{{.State.Health.Status}}' 2>/dev/null || echo gone)
            [ "$state" = healthy ] && echo "healthy" && exit 0
            [ "$state" = gone ] && break
            sleep 2
          done
          echo "::error::the image never reported healthy"
          docker inspect smoke --format 'state={{.State.Status}} exit={{.State.ExitCode}}' || true
          docker logs smoke 2>&1 | tail -50
          exit 1
      - name: Serve the built SPA, not just the API
        run: |
          set -euo pipefail
          # The health endpoint lives in Python and answers even if the web build never made it
          # into the image, so it cannot catch a missing SPA on its own.
          curl -fsS http://localhost:5959/ | grep -qi '<div id="root"' \
            || { echo "::error::/ did not serve the built SPA"; exit 1; }

      - name: Every provider the wizard offers can actually be imported
        run: |
          set -euo pipefail
          # Guards the exact bug in 549631f: the image installed a bare `pip install .`, so none of
          # the LLM SDKs were present and picking any provider in setup dead-ended on an ImportError
          # the owner could not fix — the container IS the product, they cannot pip install into it.
          # Booting proves nothing here, because every provider is imported LAZILY at first use, so
          # this has to import them on purpose. Extras are declared in pyproject's
          # [project.optional-dependencies]; keep this list in step with what the wizard offers.
          docker exec smoke python -c "
          import importlib.util, sys
          missing = [m for m in ('anthropic', 'openai', 'google.genai', 'PIL') if not importlib.util.find_spec(m)]
          if missing:
              sys.exit('::error::the image is missing provider SDK(s): ' + ', '.join(missing))
          print('all provider SDKs present')
          "
      - if: always()
        run: docker rm -f smoke >/dev/null 2>&1 || true

  docker:
    # Publish gate: build + push the image ONLY after lint, test-python (3.12 only — see that
    # job's comment for why there's no version matrix), web tests, e2e, and the image
    # actually booting are all green.
    # Restricted to pushes on dev + v* tags —
    # never on pull_request (a PR must not publish), never on workflow_dispatch, and
    # never on master. The ref test is load-bearing, not belt-and-braces: master is a
    # push trigger so the stable branch gets CI, but every `type=raw`/`type=semver`
    # rule below is gated on dev-or-tag, so a master push would reach build-push-action
    # with `push: true` and an EMPTY tag list.
    # dev push -> :dev; tag push -> :latest + :<version> + :dev.
    needs: [lint, test-python, test-web, e2e, docker-smoke]
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Publishes must not overlap: two in-flight builds pushing the same tag can
    # interleave a partial manifest. This is the ONLY thing that needs serialising,
    # which is why the workflow-level group no longer queues pushes.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # `dev` on a dev push AND on a release tag. Tags are cut from master after a
            # dev -> master promotion PR, at which point the two branches are identical, so
            # :dev must move too — otherwise the newest code sits on :latest but not on the
            # tag pre-release testers are actually pulling.
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            # During 0.x beta, :latest intentionally follows EVERY release tag
            # (including -beta.N) so testers pulling :latest get the newest beta.
            # When the first STABLE (v0.1.0) ships, switch this to metadata-action's
            # `flavor: latest=auto` so a later -beta tag can't clobber stable's :latest.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
