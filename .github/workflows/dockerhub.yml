# Docker Hub upkeep — the two things the CI publish job deliberately doesn't do.
#
# CI's `docker` job pushes :dev on every dev push and :latest/:X.Y.Z on every v* tag, to BOTH
# registries, from one build, so every tag is already mirrored. What it can't do is update the
# overview page when only the overview page changed. Hence this workflow.
name: Docker Hub

on:
  push:
    branches: [dev]
    # The overview page is the mirror's whole reason to exist (hub.docker.com pages get indexed
    # by Google; ghcr.io pages don't), so it syncs when it changes rather than waiting for a
    # release. Editing prose should not require cutting a version.
    paths: [".github/dockerhub-overview.md", ".github/workflows/dockerhub.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  description:
    name: Sync the overview page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # If this 401s, the PAT is missing write scope: Docker Hub requires a token with
      # "Read, Write, Delete" to change a repository description, though a plain
      # "Read, Write" token is enough to push images. Regenerate rather than debug.
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          # stevezzau — two z's, NOT the GitHub username. The single-z account was lost.
          username: stevezzau
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: stevezzau/shortlist
          # Hardcoded because Docker Hub caps this at 100 chars and the repo description is 200+.
          short-description: "Per-user movie & TV recommendations for Plex — a private Picked for You row for everyone"
          readme-filepath: ./.github/dockerhub-overview.md
