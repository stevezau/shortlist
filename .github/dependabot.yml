version: 2

# Dependabot security updates were already on, but without this file there were no *version*
# updates — so dependencies drifted until an advisory forced the bump. That is how react-router
# ended up 1.5 majors behind and had to be moved under pressure (#21), and why the pinned actions
# below fell 2-5 majors behind while CI warned about deprecated Node 20 runtimes.
#
# PRs target `dev` (the default branch), matching the branch model in .claude/CLAUDE.md.
# Everything is grouped so routine maintenance arrives as a few reviewable PRs rather than a swarm:
# minor/patch batched per ecosystem, majors split out individually because they need real review.

updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
