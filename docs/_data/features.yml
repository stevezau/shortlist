# The landing page feature grid. Kept as data rather than markup so the order and
# wording can change without touching the layout. `icon` is inline SVG because the
# site ships no icon font and no external requests.

- title: A private row for every user
  body: >-
    Built from their watch history, visible only to them. One container serves your whole server —
    including you: the owner gets a row like anyone else, so it's just as useful on a one-person setup.
  icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M2.5 19a6.5 6.5 0 0 1 13 0"/><path d="M16 5.5a3 3 0 0 1 0 5M18.5 19a6.5 6.5 0 0 0-2-4.7"/></svg>

- title: Smart picks, no hallucinations
  body: >-
    Every pick is a title verified to exist in your library, never invented. The built-in picker runs
    entirely in code — no key, no cloud — and an optional LLM adds a live web-search source on top.
  icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="3.5"/></svg>

- title: Candidates from everywhere
  body: >-
    Pools suggestions from TMDB, Trakt and an optional live web search for current, well-reviewed
    titles — then keeps only what's actually on your shelves.
  icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg>

- title: Web search that works offline
  body: >-
    Shortlist runs the search itself, so your model never needs internet access. A local Ollama box
    gets the same current picks as Claude — via your provider's own search, an Exa key, or both.
  icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

- title: Multiple rows, shared or personal
  body: >-
    A personal row, a “New this week” shared row, per-library rows — each with its own sources, size,
    freshness and audience. Start from a template rather than a blank form.
  icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="5" rx="1.5"/><rect x="3" y="13" width="18" height="5" rx="1.5"/></svg>

- title: Freshness you control
  body: >-
    Rows stay stable and refresh on a cadence you pick, from nightly to fortnightly — so nobody opens
    Plex to a completely reshuffled row every single day.
  icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>

- title: Block a bad seed
  body: >-
    A film someone put on for a friend shouldn't shape their picks. Block it from the run's “How we
    picked” page — the watch stays in their history, it just stops seeding.
  icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>

- title: Fills its own gaps
  body: >-
    When a great pick isn't in your library, Shortlist can ask Radarr or Sonarr to grab it. Off by
    default and cautious — the strongest picks auto-send, the rest wait for one-click approval.
  icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>

- title: Know if it's working
  body: >-
    A dashboard tracks what was delivered against what people actually watched, per user and per row.
    Recommendations you can't measure are just guesses.
  icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7 15 4-5 3 3 5-7"/></svg>

- title: Provable uninstall
  body: >-
    Share filters are snapshotted before the first change. One flow restores your server exactly as
    Shortlist found it — and <code>SHORTLIST_DRY_RUN=1</code> lets you rehearse the whole thing first.
  icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>

- title: Custom row posters
  body: >-
    Upload artwork for a row, or generate it from a text prompt reusing the AI key you already
    configured. Optional — the default posters are fine.
  icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m3 16 5-4 4 3 3-2 6 5"/></svg>

- title: Homelab-native
  body: >-
    One container, a <code>/config</code> volume, multi-arch images on GHCR, a healthcheck endpoint
    and an Unraid template. Nothing phones home.
  icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
