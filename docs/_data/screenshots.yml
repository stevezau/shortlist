# The landing-page showcase. Deliberately short: only screens that show something
# no other tool does. A users list, a settings page and a dark theme are ordinary,
# so showing them says nothing and costs the reader scroll.
#
# Captured by tests/e2e/test_screenshots.py against the fake-Plex harness, so the
# titles are made up and no real account appears.

- title: Every pick, and why it was picked
  body: >-
    Each person's row, what's in it, and the reason behind every title. If one of them looks wrong you
    can see what caused it and tell Shortlist to ignore that watch.
  image: user-detail.png
  alt: A user detail page listing that person's ranked picks, each with the title that inspired it
  path: /users/sarah
  width: 2880
  height: 2342

- title: Watch a run happen
  body: >-
    Every step for every person, with timings and a live log. When someone's row doesn't turn up, this
    page tells you which step went wrong instead of leaving you guessing.
  image: run-detail.png
  alt: A run detail page showing per-user timings, the picks delivered, and a live activity log
  path: /runs/42
  width: 2880
  height: 1742
