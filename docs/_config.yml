title: Shortlist
tagline: Per-user movie & TV recommendations for Plex
description: >-
  Self-hosted, per-user movie and TV recommendations for Plex. A private
  "Picked for You" row on every user's Plex home screen, built from their own
  watch history and visible only to them. One Docker container, works with or
  without AI.

url: https://stevezau.github.io
baseurl: /shortlist

# The card Reddit, Discord, Slack and X render when someone shares a docs link.
# The real Plex row is the whole pitch in one image, so it's worth more here than
# any logo would be.
image: /images/plex-picked-for-you.jpg

theme: jekyll-theme-cayman

# jekyll-relative-links rewrites the .md links these pages use for each other so
# they work both on github.com and on the built site.
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: false
